services:
  streamonitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamonitor
    restart: unless-stopped
    stop_grace_period: 30s
    stdin_open: true
    tty: true
    ports:
      - "5000:5000"
    volumes:
      - /home/ubuntu/apps/chatturbate2/downloads:/app/downloads
      - /home/ubuntu/apps/chatturbate2/config:/app/config
    env_file:
      - path: .env
        required: false
    environment:
      - STRMNTR_CONFIG_DIR=/app/config
      - STRMNTR_DOWNLOAD_DIR=/app/downloads
      - STRMNTR_PROXY=${STRMNTR_PROXY:-}
      - STRMNTR_HOST=0.0.0.0
      - STRMNTR_PORT=5000
      - STRMNTR_WEB_ENABLED=true
      - STRMNTR_N_M3U8DL_PATH=/usr/local/bin/N_m3u8DL-RE
